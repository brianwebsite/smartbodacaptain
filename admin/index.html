<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Boda Admin</title>
<style>
  :root {
    --green: #ff1493; --green-dark: #c4006a; --amber: #ffb300; --ink: #1c2420; --muted: #5d6b64;
    --line: #f3d3e4; --bg: #fff5fa; --card: #ffffff; --red: #b3261e; --blue: #1f5fbf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  nav { display: flex; gap: 4px; background: var(--green-dark); padding: 0 12px; overflow-x: auto; }
  nav button { background: none; border: 0; color: #ffd6ea; padding: 12px 14px; cursor: pointer; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: #fff; border-bottom-color: var(--amber); font-weight: 600; }
  nav .badge { background: var(--amber); color: #3a2a00; border-radius: 10px; padding: 0 7px; font-size: 12px; margin-left: 6px; font-weight: 700; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 700; }
  .card .l { color: var(--muted); font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; background: #e8eeea; color: var(--ink); }
  .pill.active, .pill.completed, .pill.in_progress, .pill.ok { background: #d8f0e2; color: #0b6b3f; }
  .pill.pending, .pill.requested, .pill.accepted, .pill.arrived { background: #fdecc8; color: #7a5200; }
  .pill.suspended, .pill.cancelled, .pill.no_captain, .pill.paused, .pill.blocked { background: #f8d7d4; color: var(--red); }
  button.act { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; margin-right: 4px; font-size: 13px; }
  button.act.good { background: var(--green); color: #fff; border-color: var(--green); }
  button.act.bad { color: var(--red); border-color: #e7b5b1; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 14px; cursor: pointer; }
  .filters button.on { background: var(--green); color: #fff; border-color: var(--green); }
  form.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  .primary { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .login { max-width: 360px; margin: 12vh auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 14px; }
  .login h1 { margin: 0; color: var(--green); font-size: 22px; }
  .err { color: var(--red); min-height: 1.2em; }
  .ok { color: var(--green-dark); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

// ---------- small helpers ----------
const app = document.getElementById('app');
const state = { tab: 'overview', filter: 'pending', timer: null, pendingCount: 0 };

// Build DOM nodes without ever putting server text into HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const ugx = (n) => 'UGX ' + Number(n || 0).toLocaleString('en-US');
const when = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { timeZone: 'Africa/Kampala', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const pill = (s) => h('span', { class: 'pill ' + s }, String(s).replace('_', ' '));
const place = (p) => p.label || (p.lat.toFixed(4) + ', ' + p.lng.toFixed(4));
const mapLink = (lat, lng, text) => h('a', { href: 'https://www.google.com/maps?q=' + lat + ',' + lng, target: '_blank', rel: 'noopener noreferrer' }, text);

async function api(path, options = {}) {
  const token = sessionStorage.getItem('token');
  const res = await fetch(path, {
    method: options.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }
  if (res.status === 401 && token) { signOut(); throw new Error('Signed out'); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function signOut() {
  sessionStorage.removeItem('token');
  clearInterval(state.timer);
  renderLogin();
}

// ---------- login ----------
function renderLogin(message) {
  const err = h('div', { class: 'err' }, message || '');
  const phone = h('input', { type: 'tel', placeholder: '0772 123456', autocomplete: 'username' });
  const pass = h('input', { type: 'password', autocomplete: 'current-password' });
  const form = h('form', { class: 'login' },
    h('h1', {}, 'Smart Boda Admin'),
    h('label', {}, 'Phone number', phone),
    h('label', {}, 'Password', pass),
    err,
    h('button', { class: 'primary', type: 'submit' }, 'Sign in'));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: { phone: phone.value, password: pass.value } });
      if (r.user.role !== 'admin') { err.textContent = 'This page is for Smart Boda admins only.'; return; }
      sessionStorage.setItem('token', r.token);
      renderShell();
    } catch (ex) { err.textContent = ex.message; }
  });
  app.replaceChildren(form);
}

// ---------- shell ----------
const TABS = [['overview', 'Overview'], ['captains', 'Captains'], ['users', 'Users & wallets'], ['live', 'Live'], ['trips', 'Trips'], ['review', 'Review'], ['settings', 'Settings']];

function renderShell() {
  const nav = h('nav', {}, TABS.map(([id, label]) => {
    const b = h('button', { class: state.tab === id ? 'on' : '', onclick: () => { state.tab = id; renderShell(); } }, label,
      id === 'captains' && state.pendingCount > 0 ? h('span', { class: 'badge' }, state.pendingCount) : null);
    return b;
  }));
  const body = h('main', {});
  app.replaceChildren(
    h('header', {}, h('h1', {}, 'Smart Boda Admin'), h('button', { onclick: signOut }, 'Sign out')),
    nav, body);
  clearInterval(state.timer);
  const views = { overview, captains, users, live, trips, review, settings };
  const run = () => views[state.tab](body).catch((e) => { if (e.message !== 'Signed out') body.replaceChildren(h('div', { class: 'err' }, e.message)); });
  run();
  if (state.tab === 'live' || state.tab === 'overview') state.timer = setInterval(run, 6000);
  refreshBadge();
}

async function refreshBadge() {
  try {
    const s = await api('/api/admin/stats');
    if (s.captainsPending !== state.pendingCount) {
      state.pendingCount = s.captainsPending;
      const btn = document.querySelectorAll('nav button')[1];
      if (btn) { btn.querySelector('.badge')?.remove(); if (s.captainsPending > 0) btn.append(h('span', { class: 'badge' }, s.captainsPending)); }
    }
  } catch { /* ignore */ }
}

// ---------- overview ----------
async function overview(body) {
  const s = await api('/api/admin/stats');
  state.pendingCount = s.captainsPending;
  const card = (n, l) => h('div', { class: 'card' }, h('div', { class: 'n' }, n), h('div', { class: 'l' }, l));
  const ps = await api('/api/admin/payments-status').catch(() => null);
  const out = h('span', { class: 'muted' });
  const yn = (b) => (b ? 'yes' : 'MISSING');
  const payBox = ps ? h('div', { class: 'panel', style: 'margin-bottom:12px;padding:12px' },
    h('strong', {}, ps.topupsOn ? 'Mobile money top-ups are ON' : 'Mobile money top-ups are OFF'),
    h('div', { class: 'muted' }, 'LIVEPAY_ENABLED=true: ' + yn(ps.settings.enabledFlag) + ' · API key: ' + yn(ps.settings.apiKey) +
      ' · Account number: ' + yn(ps.settings.accountNumber) + ' · Webhook secret: ' + yn(ps.settings.webhookSecret) + ' · PUBLIC_URL: ' + yn(ps.settings.publicUrl)),
    ps.webhookUrl ? h('div', { class: 'muted' }, 'Webhook address to give LivePay: ' + ps.webhookUrl) : null,
    ps.topupsOn ? h('div', { style: 'margin-top:8px' },
      h('button', { class: 'act', onclick: async (e) => {
        e.target.disabled = true; out.textContent = 'Testing...';
        try {
          const r = (await api('/api/admin/payments-status?probe=1')).probe;
          out.textContent = !r.reachable ? 'Could not reach LivePay: ' + r.message
            : r.httpStatus === 404 || r.httpStatus === 200 ? 'Connection works (LivePay accepted our key, account and server address).'
            : 'LivePay answered ' + r.httpStatus + (r.message ? ': ' + r.message : '') + (r.httpStatus === 401 || r.httpStatus === 403 ? '. This usually means a wrong API key or account number, or this server address is not on LivePay\'s allowed list.' : '');
        } catch (ex) { out.textContent = ex.message; }
        e.target.disabled = false;
      } }, 'Test LivePay connection'), ' ', out) : null,
    ps.recentTopups && ps.recentTopups.length ? h('table', { style: 'margin-top:8px' },
      h('thead', {}, h('tr', {}, ['When', 'Who', 'Phone', 'UGX', 'Status', 'Why it failed'].map((t) => h('th', {}, t)))),
      h('tbody', {}, ps.recentTopups.map((t) => h('tr', {}, h('td', {}, when(t.createdAt)), h('td', {}, t.role === 'captain' ? 'rider' : t.role), h('td', {}, t.phone),
        h('td', {}, ugx(t.amount)), h('td', {}, pill(t.status)), h('td', { class: 'muted' }, t.error || ''))))) : null) : null;
  body.replaceChildren(
    h('h2', {}, 'Overview'), payBox,
    h('div', { class: 'cards' },
      card(s.captainsPending, 'Captains waiting for approval'),
      card(s.captainsOnline, 'Captains online now'),
      card(s.tripsToday, 'Trips requested today'),
      card(s.completedToday, 'Trips completed today'),
      card(s.completedTotal, 'Trips completed, all time'),
      card(ugx(s.grossTotal), 'Fares, all time'),
      card(ugx(s.commissionTotal), 'Commission earned, all time'),
      card(ugx(s.position.commissionRevenue), 'Company commission revenue (ledger)'),
      card(ugx(s.position.unusedRiderCredit), 'Unused rider credit (not revenue)'),
      card(ugx(s.position.reservedRiderCredit), 'Rider credit set aside for accepted trips'),
      card(ugx(s.position.riderPayable), 'Payable to riders (app-paid trips)'),
      card(ugx(s.position.passengerWallets), 'Passenger wallet balances'),
      card(s.captains, 'Captains registered'),
      card(s.passengers, 'Passengers registered')));
}

// ---------- review flags ----------
async function review(body) {
  const { flags } = await api('/api/admin/flags');
  const label = { many_cancels: 'Many cancellations', late_cancels: 'Cancelled after arriving', cancel_near_pickup: 'Cancelled right at the pickup', unverified_starts: 'Started without passenger code' };
  body.replaceChildren(h('h2', {}, 'Review'),
    h('p', { class: 'muted' }, 'Patterns from the last 7 days that deserve a look, for example a rider cancelling at the pickup and taking the passenger privately. These are signs, not proof: GPS can be wrong, so nothing here charges or blocks anyone. Check the trips, call the people, then decide.'),
    h('div', { class: 'panel' }, flags.length === 0 ? h('div', { class: 'empty' }, 'Nothing to review.') :
      h('table', {},
        h('thead', {}, h('tr', {}, ['Person', 'Role', 'Sign', 'What we saw', 'Trips'].map((t) => h('th', {}, t)))),
        h('tbody', {}, flags.map((f) => h('tr', {},
          h('td', {}, h('strong', {}, f.name), h('div', { class: 'muted' }, f.phone || '')),
          h('td', {}, f.role === 'captain' ? 'rider' : f.role),
          h('td', {}, label[f.code] || f.code),
          h('td', {}, f.message),
          h('td', { class: 'muted' }, f.tripIds.map((i) => i.slice(0, 8)).join(', '))))))));
}

// ---------- captains ----------
async function captains(body) {
  const q = state.filter === 'all' ? '' : '?status=' + state.filter;
  const { captains: list } = await api('/api/admin/captains' + q);
  const filters = h('div', { class: 'filters' }, ['pending', 'active', 'suspended', 'all'].map((f) =>
    h('button', { class: state.filter === f ? 'on' : '', onclick: () => { state.filter = f; captains(body); } }, f[0].toUpperCase() + f.slice(1))));
  const act = (label, cls, fn) => h('button', { class: 'act ' + cls, onclick: async (e) => {
    e.target.disabled = true;
    try { await fn(); await captains(body); refreshBadge(); } catch (ex) { alert(ex.message); e.target.disabled = false; }
  } }, label);

  const rows = list.map((c) => h('tr', {},
    h('td', {}, h('strong', {}, c.name), h('div', { class: 'muted' }, c.phone)),
    h('td', {}, c.bikePlate, h('div', { class: 'muted' }, vehicleName(c.vehicleType) + (c.bikeModel ? ' · ' + c.bikeModel : ''))),
    h('td', {}, 'ID ' + c.nationalId, h('div', { class: 'muted' }, 'Permit ' + c.permitNumber)),
    h('td', {}, c.stageName || ''),
    h('td', {}, pill(c.status), c.online ? h('div', { class: 'muted' }, 'online') : null),
    h('td', {}, c.trips + ' trips', h('div', { class: 'muted' }, c.avgRating == null ? 'no ratings' : c.avgRating + ' / 5')),
    h('td', {}, 'credit ' + ugx(c.creditFree), h('div', { class: 'muted' }, 'set aside ' + ugx(c.creditReserved) + ' · payable ' + ugx(c.walletBalance))),
    h('td', {}, pill(c.standing || 'ok')),
    h('td', {},
      c.status !== 'active' ? act('Approve', 'good', () => api('/api/admin/captains/' + c.id + '/approve', { method: 'POST', body: {} })) : null,
      c.status !== 'suspended' ? act('Suspend', 'bad', () => { if (!confirm('Suspend ' + c.name + '?')) throw new Error('Cancelled'); return api('/api/admin/captains/' + c.id + '/suspend', { method: 'POST', body: {} }); }) : null,
      c.walletBalance > 0 ? act('Pay out wallet', '', async () => {
        const v = prompt('Pay out to ' + c.name + ' (UGX). Wallet: ' + c.walletBalance + '. Send the money first, then record it here.');
        if (!v) throw new Error('Cancelled');
        const amount = Number.parseInt(v.replace(/[, ]/g, ''), 10);
        await api('/api/admin/captains/' + c.id + '/payout', { method: 'POST', body: { amount, note: prompt('Note (for example MoMo reference)') || '' } });
      }) : null,
      act('Add credit', '', async () => {
        const v = prompt('Commission credit to add for ' + c.name + ' (UGX). Only after you received the money.');
        if (!v) throw new Error('Cancelled');
        const amount = Number.parseInt(v.replace(/[, ]/g, ''), 10);
        const note = prompt('Reason (required, for example MoMo reference)') || '';
        await api('/api/admin/users/' + c.id + '/wallet', { method: 'POST', body: { amount, note } });
      }))));
  body.replaceChildren(
    h('h2', {}, 'Captains'), filters,
    h('div', { class: 'panel' }, list.length === 0 ? h('div', { class: 'empty' }, 'No captains here yet.') :
      h('table', {},
        h('thead', {}, h('tr', {}, ['Captain', 'Bike', 'Documents to check', 'Stage', 'Status', 'Record', 'Commission credit', 'Standing', 'Actions'].map((t) => h('th', {}, t)))),
        h('tbody', {}, rows))));
}

// ---------- users & wallets ----------
async function users(body) {
  const box = h('input', { type: 'search', placeholder: 'Search name, phone or email', value: state.userQuery || '' });
  const out = h('div', { class: 'panel' });
  const load = async () => {
    state.userQuery = box.value;
    const { users: list } = await api('/api/admin/users?q=' + encodeURIComponent(box.value.trim()));
    const act = (label, cls, fn) => h('button', { class: 'act ' + cls, onclick: async (e) => {
      e.target.disabled = true;
      try { await fn(); await load(); } catch (ex) { if (ex.message !== 'Cancelled') alert(ex.message); e.target.disabled = false; }
    } }, label);
    out.replaceChildren(list.length === 0 ? h('div', { class: 'empty' }, 'Nobody found.') :
      h('table', {}, h('thead', {}, h('tr', {}, ['Person', 'Role', 'Wallet', 'Actions'].map((t) => h('th', {}, t)))),
        h('tbody', {}, list.map((u) => h('tr', {},
          h('td', {}, h('strong', {}, u.name), h('div', { class: 'muted' }, [u.phone, u.email].filter(Boolean).join(' · '))),
          h('td', {}, u.role), h('td', {}, u.role === 'captain' ? 'credit ' + ugx(u.creditFree) + ' (set aside ' + ugx(u.creditReserved) + '), payable ' + ugx(u.walletBalance) : ugx(u.walletBalance)),
          h('td', {},
            act(u.role === 'captain' ? 'Add credit' : 'Add money', 'good', async () => {
              const v = prompt('Add to ' + u.name + "'s wallet (UGX). Use a minus sign to take money back.");
              if (!v) throw new Error('Cancelled');
              const amount = Number.parseInt(v.replace(/[, ]/g, ''), 10);
              await api('/api/admin/users/' + u.id + '/wallet', { method: 'POST', body: { amount, note: prompt('Reason (required, for example MoMo reference)') || '' } });
            }),
            act('Reset password', '', async () => {
              const pw = prompt('New password for ' + u.name + ' (at least 6 characters). Tell them privately.');
              if (!pw) throw new Error('Cancelled');
              await api('/api/admin/users/' + u.id + '/password', { method: 'POST', body: { password: pw } });
              alert('Password changed. They have been signed out everywhere.');
            })))))));
  };
  let timer;
  box.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => load().catch(() => {}), 300); });
  body.replaceChildren(h('h2', {}, 'Users & wallets'),
    h('p', { class: 'muted' }, 'Until mobile-money top-up is switched on, you can add money to a passenger wallet after they pay you, and reset passwords for people who cannot get the email code.'),
    h('div', { class: 'panel' }, box), out);
  await load();
}

// ---------- live ----------
async function live(body) {
  const { captains: cs, trips: ts } = await api('/api/admin/live');
  body.replaceChildren(
    h('h2', {}, 'Live'),
    h('div', { class: 'panel' }, h('h3', {}, 'Captains online (' + cs.length + ')'),
      cs.length === 0 ? h('div', { class: 'empty' }, 'Nobody is online.') :
      h('table', {}, h('thead', {}, h('tr', {}, ['Captain', 'Bike', 'Busy', 'Last location'].map((t) => h('th', {}, t)))),
        h('tbody', {}, cs.map((c) => h('tr', {}, h('td', {}, c.name), h('td', {}, c.bikePlate), h('td', {}, c.onTrip ? 'On a trip' : 'Free'),
          h('td', {}, mapLink(c.lat, c.lng, 'Open map'), ' ', h('span', { class: 'muted' }, when(c.locationAt)))))))),
    h('div', { class: 'panel' }, h('h3', {}, 'Trips in progress (' + ts.length + ')'),
      ts.length === 0 ? h('div', { class: 'empty' }, 'No active trips.') : tripTable(ts)));
}

// ---------- trips ----------
const VEHICLE_NAMES = { boda: 'Boda', electric_boda: 'Electric boda', car: 'Car (3 seats)', car_xl: 'Car XL (6 seats)' };
const vehicleName = (t) => VEHICLE_NAMES[t] || t || '';
const CANCEL_NAMES = {
  changed_mind: 'Changed mind', wait_too_long: 'Waited too long', captain_far: 'Captain too far', wrong_pickup: 'Wrong pickup/drop-off',
  found_other_ride: 'Found another ride', price_too_high: 'Price too high', passenger_no_show: 'Passenger did not show',
  passenger_asked: 'Passenger asked to cancel', too_far: 'Pickup too far', vehicle_problem: 'Vehicle problem', safety: 'Safety', other: 'Other',
};

function tripTable(list) {
  return h('table', {},
    h('thead', {}, h('tr', {}, ['When', 'Status', 'Type', 'Passenger', 'Captain', 'From', 'To', 'Distance', 'Fare', 'Commission'].map((t) => h('th', {}, t)))),
    h('tbody', {}, list.map((t) => h('tr', {},
      h('td', {}, when(t.createdAt)),
      h('td', {}, pill(t.status), t.status === 'cancelled' ? h('div', { class: 'muted' }, (t.cancelledBy || '') + (t.cancelReason ? ': ' + (CANCEL_NAMES[t.cancelReason] || t.cancelReason) : '')) : null),
      h('td', {}, vehicleName(t.vehicleType),
        h('div', { class: 'muted' }, [t.kind === 'delivery' ? 'Delivery: ' + (t.deliveryItem || '') : 'Ride', t.paymentMethod === 'wallet' ? 'wallet' : 'cash', t.nightPercent ? '+' + t.nightPercent + '% night' : '', t.autoStarted ? 'auto-started' : ''].filter(Boolean).join(' · '))),
      h('td', {}, t.passenger.name, h('div', { class: 'muted' }, t.passenger.phone || 'email only')),
      h('td', {}, t.captain ? [t.captain.name, h('div', { class: 'muted' }, t.captain.bikePlate)] : h('span', { class: 'muted' }, 'none')),
      h('td', {}, mapLink(t.pickup.lat, t.pickup.lng, place(t.pickup))),
      h('td', {}, mapLink(t.dropoff.lat, t.dropoff.lng, place(t.dropoff))),
      h('td', {}, t.distanceKm + ' km', h('div', { class: 'muted' }, t.routeSource)),
      h('td', {}, ugx(t.fare)), h('td', {}, ugx(t.commission))))));
}

async function trips(body) {
  const { trips: list } = await api('/api/admin/trips?limit=100');
  body.replaceChildren(h('h2', {}, 'Trips'),
    h('div', { class: 'panel' }, list.length === 0 ? h('div', { class: 'empty' }, 'No trips yet.') : tripTable(list)));
}

// ---------- settings ----------
async function settings(body) {
  const s = await api('/api/admin/settings');
  const status = h('span', { class: 'ok' });
  const field = (label, value, step) => { const i = h('input', { type: 'number', step: step || '1', min: '0', value }); return [h('label', {}, label, i), i]; };
  const tfield = (label, value, ph) => { const i = h('input', { type: 'text', value: value || '', placeholder: ph || '' }); return [h('label', {}, label, i), i]; };
  const t = {
    supportPhone: tfield('Support phone number', s.app.supportPhone, '+2567...'),
    supportEmail: tfield('Support email', s.app.supportEmail),
    whatsapp: tfield('WhatsApp link', s.app.whatsapp, 'https://wa.me/2567...'),
    facebook: tfield('Facebook link', s.app.facebook, 'https://facebook.com/...'),
    instagram: tfield('Instagram link', s.app.instagram, 'https://instagram.com/...'),
    x: tfield('X (Twitter) link', s.app.x, 'https://x.com/...'),
    tiktok: tfield('TikTok link', s.app.tiktok, 'https://tiktok.com/@...'),
    youtube: tfield('YouTube link', s.app.youtube, 'https://youtube.com/@...'),
    androidStoreUrl: tfield('Play Store link (for Rate app)', s.app.androidStoreUrl, 'https://play.google.com/store/apps/details?id=...'),
    about: tfield('About us text', s.app.about),
  };
  const f = {
    baseFare: field('Base fare (UGX)', s.fare.baseFare), perKm: field('Per kilometre (UGX)', s.fare.perKm),
    perMinute: field('Per minute (UGX)', s.fare.perMinute), minimumFare: field('Minimum fare (UGX)', s.fare.minimumFare),
    commission: field('Commission (%)', Math.round(s.fare.commissionRate * 1000) / 10, '0.5'),
    roundTo: field('Round fares to nearest (UGX)', s.fare.roundTo),
    maxKm: field('Offer trips to captains within (km)', s.dispatch.maxKm, '0.1'), limit: field('Nearest captains offered each trip', s.dispatch.limit),
    mBoda: field('Boda price level (1 = base fare)', s.vehicles.boda.multiplier, '0.05'),
    mElectric: field('Electric boda price level', s.vehicles.electric_boda.multiplier, '0.05'),
    mCar: field('Car (3 seats) price level (2 = double)', s.vehicles.car.multiplier, '0.05'),
    mCarXl: field('Car XL (6 seats) price level', s.vehicles.car_xl.multiplier, '0.05'),
    delivery: field('Delivery price level (1 = same as a ride)', s.limits.deliveryMultiplier, '0.05'),
    nightPct: field('Night fare increase (%)', s.night.percent, '0.5'),
    nightFrom: field('Night starts (hour, 0-23, Uganda time)', s.night.startHour),
    nightTo: field('Night ends (hour, 0-23)', s.night.endHour),
    stale: field('Ignore locations older than (seconds)', s.dispatch.staleAfterSeconds), offer: field('Give up finding a captain after (seconds)', s.dispatch.offerSeconds),
  };
  const v = (k) => Number(f[k][1].value);
  const form = h('form', { class: 'grid' }, Object.values(f).map((x) => x[0]), h('h3', { style: 'grid-column:1/-1;margin:12px 0 0' }, 'App contact details and social links (shown in the apps under Account)'), Object.values(t).map((x) => x[0]),
    h('div', {}, h('button', { class: 'primary', type: 'submit' }, 'Save settings'), ' ', status));
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); status.className = 'ok'; status.textContent = '';
    try {
      await api('/api/admin/settings', { method: 'PUT', body: {
        fare: { baseFare: v('baseFare'), perKm: v('perKm'), perMinute: v('perMinute'), minimumFare: v('minimumFare'), commissionRate: v('commission') / 100, roundTo: v('roundTo') },
        vehicles: { boda: { multiplier: v('mBoda') }, electric_boda: { multiplier: v('mElectric') }, car: { multiplier: v('mCar') }, car_xl: { multiplier: v('mCarXl') } },
        night: { percent: v('nightPct'), startHour: v('nightFrom'), endHour: v('nightTo') },
        limits: { deliveryMultiplier: v('delivery') },
        app: Object.fromEntries(Object.entries(t).map(([k, x]) => [k, x[1].value.trim()])),
        dispatch: { maxKm: v('maxKm'), limit: v('limit'), staleAfterSeconds: v('stale'), offerSeconds: v('offer') } } });
      status.textContent = 'Saved. New trips use these numbers.';
    } catch (ex) { status.className = 'err'; status.textContent = ex.message; }
  });
  body.replaceChildren(h('h2', {}, 'Fares and dispatch'),
    h('div', { class: 'panel' }, h('p', { class: 'muted' }, 'Fare = base + distance + time, rounded, never below the minimum. Trips already requested keep the fare they were quoted.'), form));
}

// ---------- start ----------
if (sessionStorage.getItem('token')) renderShell(); else renderLogin();
</script>
</body>
</html>
